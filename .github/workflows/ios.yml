name: Build iPhone app

# Every push compiles the app, which needs no Apple account.
# "Run workflow" (manual) also signs it and sends it to TestFlight.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile check
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.example.lightmedia
      TEAM_ID: ""
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::This build machine has no Xcode 26, which Apple now requires for uploads."; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Test media library parsing and download validation
        run: |
          swiftc LightMedia/Core/UPnP.swift LightMedia/Core/DownloadValidation.swift Tests/MediaLibrary/main.swift -o "$RUNNER_TEMP/media-library-tests"
          "$RUNNER_TEMP/media-library-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: |
          xcodegen generate
          pod install
      - name: Compile
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace LightMedia.xcworkspace -scheme LightMedia -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:" build.log | sort -u | head -200 || true
              echo "::endgroup::"
              tail -40 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -60 || true
          echo "Compiled successfully."
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build.log
          if-no-files-found: ignore

  testflight:
    name: Sign and upload to TestFlight
    needs: compile
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Apple settings are present
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ] || missing="$missing BUNDLE_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see START-HERE-iPhone.md)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::This build machine has no Xcode 26, which Apple now requires for uploads."; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: |
          xcodegen generate
          pod install
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace LightMedia.xcworkspace -scheme LightMedia -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LightMedia.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > archive.log 2>&1 || {
              grep -E "error:" archive.log | sort -u | head -100 || true
              tail -60 archive.log
              exit 1
            }
          echo "Archived."
      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/LightMedia.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || {
              grep -E "error:|Error" export.log | sort -u | head -100 || true
              tail -60 export.log
              exit 1
            }
          tail -5 export.log
          echo "Uploaded. The build appears in TestFlight after Apple finishes processing it (usually 5 to 30 minutes)."
      - name: Tidy up temporary signing certificates
        if: always()
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography || python3 -m pip install --quiet --user pyjwt cryptography
          python3 ci/revoke_dev_certs.py
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Keep the signing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
